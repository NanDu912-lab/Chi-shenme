<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吃什么 - 今晚吃什么？问问就知道了</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #fff5f0 0%, #ffe8d6 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
.app { width: 390px; height: 844px; display: flex; flex-direction: column; background: linear-gradient(135deg, #fff5f0 0%, #ffe8d6 100%); box-shadow: 0 4px 24px rgba(0,0,0,0.1); border-radius: 20px; overflow: hidden; }
header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: linear-gradient(135deg, #ff6b35, #f7931e); color: #fff; box-shadow: 0 2px 12px rgba(255,107,53,0.3); }
.header-left { display: flex; align-items: center; gap: 8px; }
.header-left h1 { font-size: 20px; font-weight: 700; }
.header-btns { display: flex; gap: 8px; }
.header-btns button { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 14px; border-radius: 16px; cursor: pointer; font-size: 13px; font-weight: 500; }
.pref-banner { padding: 8px 20px; background: #fff8f4; border-bottom: 1px solid #ffe8d6; font-size: 12px; color: #999; display: flex; align-items: center; gap: 6px; }
.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.empty-state { text-align: center; margin-top: 60px; }
.empty-state .icon { font-size: 56px; margin-bottom: 16px; }
.empty-state p { color: #666; font-size: 17px; line-height: 1.6; }
.quick-suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 28px; }
.quick-suggestions button { padding: 8px 16px; border-radius: 20px; border: 1px solid #ffb088; background: #fff; color: #ff6b35; cursor: pointer; font-size: 14px; transition: all 0.2s; }
.quick-suggestions button:hover { background: #fff3ed; }
.msg-row { display: flex; }
.msg-row.user { justify-content: flex-end; }
.msg-row.assistant { justify-content: flex-start; }
.msg-bubble { max-width: 80%; padding: 12px 16px; font-size: 15px; line-height: 1.6; word-break: break-word; }
.msg-row.user .msg-bubble { border-radius: 18px 18px 4px 18px; background: linear-gradient(135deg, #ff6b35, #f7931e); color: #fff; box-shadow: 0 2px 8px rgba(255,107,53,0.25); }
.msg-row.assistant .msg-bubble { border-radius: 18px 18px 18px 4px; background: #fff; color: #333; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.msg-actions { display: flex; gap: 8px; margin-top: 8px; padding-left: 4px; }
.msg-actions button { padding: 6px 14px; border-radius: 16px; border: 1px solid #ddd; background: #fff; color: #666; cursor: pointer; font-size: 13px; }
.filter-bar { padding: 10px 20px 6px; background: #fff; border-top: 1px solid #f0e8e3; }
.filter-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.filter-label { font-size: 12px; color: #999; min-width: 36px; }
.filter-options { display: flex; gap: 4px; flex-wrap: wrap; }
.filter-chip { padding: 4px 12px; border-radius: 14px; border: 1px solid #e8e0dc; background: #fff; color: #555; cursor: pointer; font-size: 13px; transition: all 0.15s; }
.filter-chip.active { border-color: #ff6b35; background: #fff3ed; color: #ff6b35; font-weight: 600; }
.input-bar { padding: 12px 20px; background: #fff; border-top: 1px solid #f0e8e3; display: flex; gap: 10px; align-items: center; }
.input-bar input { flex: 1; padding: 12px 16px; border-radius: 24px; border: 2px solid #ffe0d0; outline: none; font-size: 15px; font-family: inherit; transition: border-color 0.2s; }
.input-bar input:focus { border-color: #ff6b35; }
.input-bar button { padding: 10px 24px; border-radius: 24px; border: none; background: linear-gradient(135deg, #ff6b35, #f7931e); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; box-shadow: 0 2px 8px rgba(255,107,53,0.3); }
.input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
.onboarding { display: flex; flex-direction: column; width: 390px; height: 844px; background: linear-gradient(135deg, #fff5f0 0%, #ffe8d6 100%); box-shadow: 0 4px 24px rgba(0,0,0,0.1); border-radius: 20px; overflow: hidden; }
.onboarding header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: linear-gradient(135deg, #ff6b35, #f7931e); color: #fff; box-shadow: 0 2px 12px rgba(255,107,53,0.3); }
.onboarding-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.onboarding-body h2 { font-size: 22px; font-weight: 700; color: #333; margin-bottom: 6px; }
.onboarding-body .subtitle { color: #888; font-size: 14px; margin-bottom: 28px; }
.taste-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; justify-content: center; }
.taste-chip { padding: 8px 16px; border-radius: 20px; border: 2px solid #e8e0dc; background: #fff; color: #555; cursor: pointer; font-size: 14px; transition: all 0.15s; }
.taste-chip.active { border-color: #ff6b35; background: #fff3ed; color: #ff6b35; font-weight: 600; }
.shops-input { width: 100%; padding: 10px 14px; border-radius: 12px; border: 2px solid #ffe0d0; outline: none; font-size: 14px; resize: none; font-family: inherit; margin-bottom: 28px; transition: border-color 0.2s; }
.shops-input:focus { border-color: #ff6b35; }
.onboarding-btns { display: flex; gap: 12px; }
.btn-primary { padding: 12px 32px; border-radius: 24px; border: none; background: linear-gradient(135deg, #ff6b35, #f7931e); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; box-shadow: 0 2px 8px rgba(255,107,53,0.3); }
.btn-secondary { padding: 12px 24px; border-radius: 24px; border: 2px solid #ddd; background: #fff; color: #999; font-weight: 500; font-size: 15px; cursor: pointer; }
.section-label { font-size: 14px; font-weight: 600; color: #555; margin-bottom: 10px; align-self: flex-start; }
.refresh-hint { font-size: 13px; color: #999; margin-top: 8px; padding-left: 4px; }
strong { font-weight: 700; }
</style>
</head>
<body>

<div id="app"></div>

<script>
const API_KEY = "sk-ws-H.EPXLXPR.18sN.MEUCIQDSI1XuoDglK1ls8POgDA3Sf4fYk0s8BQY8dyhXkk1MgAIgFV2b1sikXmNBngYy8-5TblMmsr5cOY0kKy0m_6vgoLs";
const API_BASE = "https://dashscope.aliyuncs.com/compatible-mode/v1";
const MODEL = "qwen-plus";
const STORAGE_KEY = "chi-shenme-prefs";

const SYSTEM_PROMPT = `你是"吃什么"——一个帮人快速决定吃什么的友好助手。风格轻松，像朋友聊天。

## 核心原则
- 少选项、低思考、快速拍板
- 每次推荐 2-3 个方案，不要更多
- 回复简短，每次不超过 200 字

## 对话流程

### 了解情况
通过自然对话了解（不要一次问太多，像聊天一样）：
- 几个人吃
- 口味偏好（辣/清淡/重口等）
- 预算

用户说"随便"时，主动推荐几个方向让他们选。
如果用户通过筛选器传入了偏好，直接基于偏好推荐，不用再问。

### 给出推荐

**自己做：**
根据人数推荐合适的菜品组合。1 人推荐 1-2 道菜，2 人推荐 2-3 道菜，3 人以上推荐 3-4 道菜（含主食）。用户选一道后给出详细菜谱（食材 + 步骤）。

**出去吃：**
推荐 2-3 家适合的餐厅类型或菜系，说明推荐理由。

### 换一批
用户说"换一批"或"重新推荐"时，给新的 2-3 个方案。

### 踩雷
用户说"不想吃这个"或"不想看到这个"时，记住这个偏好，后续不再推荐，并补一个新的方案。

## 规则
- 语气友好轻松，可以用 emoji 但不要太多
- 每次只问一个问题
- 推荐要接地气，考虑实际场景
- 用中文回复
- 推荐时每个方案单独一行，方便用户选择
- 根据人数合理搭配菜品数量，不要出现多人只推荐一道菜的情况`;
const TASTE_OPTIONS = ["️ 辣", "🧂 咸鲜", "🍬 甜", " 酸", "🌿 清淡", " 重口", "🥩 肉多", "🥬 素食", "🍜 面食", "🍚 米饭", " 小吃", "🍲 汤锅"];
const FILTER_OPTIONS = {
  budget: { label: "预算", options: ["20 以内", "20-50", "50-100", "100+"] },
  method: { label: "方式", options: ["自己做", "出去吃"] },
  people: { label: "人数", options: ["1 人", "2 人", "3-4 人", "5 人+"] }
};
const QUICK_SUGGESTIONS = ["有点想吃辣的", "随便推荐一个", "想自己做饭", "想出去吃"];

function loadPrefs() {
  try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; } catch { return null; }
}
function savePrefs(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }

let prefs = loadPrefs();
let messages = [];
let inputText = "";
let isLoading = false;
let filters = { budget: null, method: null, people: null };
let refreshCount = 0;
let showOnboarding = !prefs?.onboarded;

function render() {
  const app = document.getElementById("app");
  if (showOnboarding) { app.innerHTML = renderOnboarding(); bindOnboarding(); return; }
  app.innerHTML = renderChat();
  bindChat();
  scrollToBottom();
}

function renderOnboarding() {
  const saved = loadPrefs() || { tastes: [], shops: "" };
  return `
    <div class="onboarding">
      <header><div class="header-left"><span style="font-size:24px">🍜</span><h1>吃什么</h1></div></header>
      <div class="onboarding-body">
        <div style="font-size:48px;margin-bottom:12px">🍽️</div>
        <h2>先告诉我你的口味</h2>
        <p class="subtitle">之后推荐会更懂你，也可以跳过</p>
        <p class="section-label">常吃的口味（可多选）</p>
        <div class="taste-grid" id="tasteGrid">${TASTE_OPTIONS.map(t => `<button class="taste-chip${saved.tastes.includes(t) ? ' active' : ''}" data-taste="${t}">${t}</button>`).join("")}</div>
        <p class="section-label">常去的店 / 爱吃的菜（选填）</p>
        <textarea class="shops-input" id="shopsInput" rows="2" placeholder="例如：黄焖鸡、沙县小吃、螺蛳粉、麦当劳...">${saved.shops}</textarea>
        <div class="onboarding-btns">
          <button class="btn-primary" id="saveBtn">保存并开始</button>
          <button class="btn-secondary" id="skipBtn">跳过</button>
        </div>
      </div>
    </div>`;
}

function bindOnboarding() {
  let selected = [...(loadPrefs()?.tastes || [])];
  document.querySelectorAll(".taste-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      const t = btn.dataset.taste;
      const idx = selected.indexOf(t);
      if (idx >= 0) selected.splice(idx, 1); else selected.push(t);
      btn.classList.toggle("active");
    });
  });
  document.getElementById("saveBtn").addEventListener("click", () => {
    const shops = document.getElementById("shopsInput").value;
    const p = { tastes: selected, shops, onboarded: true };
    savePrefs(p); prefs = p; showOnboarding = false; render();
  });
  document.getElementById("skipBtn").addEventListener("click", () => { showOnboarding = false; render(); });
}

function renderChat() {
  const hasPref = prefs && (prefs.tastes.length > 0 || prefs.shops.trim());
  return `
    <div class="app">
      <header>
        <div class="header-left"><span style="font-size:24px">🍜</span><h1>吃什么</h1></div>
        <div class="header-btns">
          <button id="clearPrefsBtn">偏好</button>
          ${messages.length > 0 ? '<button id="resetBtn">重新开始</button>' : ""}
        </div>
      </header>
      ${hasPref ? `<div class="pref-banner"><span></span><span>${prefs.tastes.join("、")}${prefs.tastes.length && prefs.shops.trim() ? " · " : ""}${prefs.shops.trim()}</span></div>` : ""}
      <div class="messages" id="messagesContainer">
        ${messages.length === 0 ? renderEmpty() : messages.map((m, i) => renderMessage(m, i)).join("")}
        <div id="scrollAnchor"></div>
      </div>
      <div class="filter-bar">${Object.keys(FILTER_OPTIONS).map(k => `
        <div class="filter-row">
          <span class="filter-label">${FILTER_OPTIONS[k].label}</span>
          <div class="filter-options">${FILTER_OPTIONS[k].options.map(o => `<button class="filter-chip${filters[k] === o ? ' active' : ''}" data-key="${k}" data-val="${o}">${o}</button>`).join("")}</div>
        </div>`).join("")}</div>
      <div class="input-bar">
        <input id="msgInput" type="text" placeholder="跟我说说你想吃什么..." value="${escapeHtml(inputText)}" ${isLoading ? "disabled" : ""}>
        <button id="sendBtn" ${isLoading ? "disabled" : ""}>发送</button>
      </div>
    </div>`;
}

function renderEmpty() {
  return `<div class="empty-state">
    <div class="icon">🍽️</div>
    <p>${prefs ? "已记住你的口味，直接说想法吧~" : "今晚吃什么？跟我聊聊，帮你出主意~"}</p>
    <div class="quick-suggestions">${QUICK_SUGGESTIONS.map(s => `<button data-quick="${s}">${s}</button>`).join("")}</div>
  </div>`;
}

function renderMessage(msg, i) {
  const isUser = msg.role === "user";
  const isEmpty = !msg.content && !isUser;
  const isLast = isLastAssistant(i);
  const showActions = isLast && !isEmpty && !isLoading && refreshCount < 2;
  const formatted = isUser ? escapeHtml(msg.display || msg.content) : formatContent(msg.content);
  let html = `<div class="msg-row ${isUser ? 'user' : 'assistant'}"><div class="msg-bubble">${isEmpty ? '<span style="color:#999">思考中...</span>' : formatted}</div></div>`;
  if (showActions) {
    const left = 2 - refreshCount;
    html += `<div class="msg-actions">
      <button id="refreshBtn">🔄 换一批 ${left > 0 ? `(还剩${left}次)` : ""}</button>
      <button id="rejectBtn"> 不想吃这个</button>
    </div>`;
  }
  if (isLast && !isEmpty && !isLoading && refreshCount >= 2) {
    html += `<p class="refresh-hint">已经换过 2 次啦，别纠结，从上面选一个吧 </p>`;
  }
  return html;
}

function isLastAssistant(i) {
  for (let j = messages.length - 1; j >= 0; j--) {
    if (messages[j].role === "assistant") return j === i;
    if (messages[j].role === "user") return false;
  }
  return false;
}

function formatContent(text) {
  return text.split("\n").map(line => {
    const f = line.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
    return `<span>${f}</span>`;
  }).join("<br>");
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function bindChat() {
  document.querySelectorAll(".filter-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      const k = btn.dataset.key, v = btn.dataset.val;
      filters[k] = filters[k] === v ? null : v;
      render();
    });
  });
  const sendBtn = document.getElementById("sendBtn");
  const msgInput = document.getElementById("msgInput");
  sendBtn.addEventListener("click", () => sendMessage(msgInput.value));
  msgInput.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(msgInput.value); });
  document.querySelectorAll("[data-quick]").forEach(btn => {
    btn.addEventListener("click", () => sendMessage(btn.dataset.quick));
  });
  const refreshBtn = document.getElementById("refreshBtn");
  if (refreshBtn) refreshBtn.addEventListener("click", () => { if (refreshCount < 2) { refreshCount++; sendMessage("换一批，重新推荐"); } });
  const rejectBtn = document.getElementById("rejectBtn");
  if (rejectBtn) rejectBtn.addEventListener("click", () => sendMessage("这个不想吃，换一个"));
  const resetBtn = document.getElementById("resetBtn");
  if (resetBtn) resetBtn.addEventListener("click", () => { messages = []; inputText = ""; isLoading = false; refreshCount = 0; filters = { budget: null, method: null, people: null }; render(); });
  const clearBtn = document.getElementById("clearPrefsBtn");
  if (clearBtn) clearBtn.addEventListener("click", () => { localStorage.removeItem(STORAGE_KEY); prefs = null; showOnboarding = true; messages = []; inputText = ""; isLoading = false; refreshCount = 0; filters = { budget: null, method: null, people: null }; render(); });
}

async function sendMessage(text) {
  const trimmed = text.trim();
  if (!trimmed || isLoading) return;
  const filterParts = [];
  if (filters.budget) filterParts.push(`预算${filters.budget}`);
  if (filters.method) filterParts.push(filters.method);
  if (filters.people) filterParts.push(`${filters.people}吃`);
  const filterText = filterParts.length ? ` [${filterParts.join(" / ")}]` : "";
  const prefText = messages.length === 0 && prefs ? getPrefText() : "";
  const fullText = `${trimmed}${filterText}${prefText}`;
  inputText = "";
  const userMsg = { role: "user", content: fullText, display: trimmed };
  messages.push(userMsg);
  messages.push({ role: "assistant", content: "" });
  isLoading = true;
  render();

  try {
    const res = await fetch(`${API_BASE}/chat/completions`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${API_KEY}`
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [{ role: "system", content: SYSTEM_PROMPT }, ...messages.slice(0, -1)],
        stream: false,
        temperature: 0.8,
        max_tokens: 500
      })
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || e.message || `HTTP ${res.status}`); }
    const data = await res.json();
    messages[messages.length - 1].content = data.choices?.[0]?.message?.content || "抱歉，出了点问题";
  } catch (err) {
    messages[messages.length - 1].content = `❌ ${err.message}`;
  } finally {
    isLoading = false;
    render();
  }
}

function getPrefText() {
  if (!prefs) return "";
  const parts = [];
  if (prefs.tastes.length) parts.push(`口味偏好：${prefs.tastes.join("、")}`);
  if (prefs.shops.trim()) parts.push(`常去的店/爱吃的：${prefs.shops.trim()}`);
  return parts.length ? `\n\n[用户长期偏好] ${parts.join("；")}` : "";
}

function scrollToBottom() {
  const el = document.getElementById("scrollAnchor");
  if (el) el.scrollIntoView({ behavior: "smooth" });
}

render();
</script>
</body>
</html>
